<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <title>Contacto | VetConnect</title>
</head>

<body>

    <header>
        <h1>Contacto</h1>
    </header>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                VetConnect
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir navegación">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>
<main>

    <div class="container my-5">

        <h2 class="mb-4">Contacto</h2>

        <form>

            <div class="mb-3">

                <label
                    for="nombre"
                    class="form-label">
                    Nombre
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre">

            </div>


            <div class="mb-3">

                <label
                    for="correo"
                    class="form-label">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="correo"
                    name="correo">

            </div>


            <div class="mb-3">

                <label
                    for="mensaje"
                    class="form-label">
                    Mensaje
                </label>

                <textarea
                    class="form-control"
                    id="mensaje"
                    name="mensaje"
                    rows="4">
                </textarea>

            </div>


            <button
                type="submit"
                class="btn btn-primary">

                Enviar

            </button>

        </form>

    </div>

</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
