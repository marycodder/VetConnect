<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <title>Iniciar sesión | VetConnect</title>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-6 col-lg-4">

                <div class="card mt-5">

                    <div class="card-body">

                        <h3 class="text-center mb-4">
                            Iniciar sesión
                        </h3>

                        <form>

                            <div class="mb-3">

                                <label
                                    for="loginCorreo"
                                    class="form-label">
                                    Correo
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="loginCorreo">

                            </div>


                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label">
                                    Contraseña
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password">

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Ingresar

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
